<title>Tournoi VBO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: single mobile app frame (max 440px), screen router, sticky bottom tab bar + contextual top bar */
:root{
  /* Palette Volley-Ball Ollioulais — verts club, thème clair style iOS */
  --ink:#0a2410;        /* vert forêt profond */
  --bg:#f2f6f0;         /* fond groupé clair, légère teinte verte (iOS) */
  --surface:#ffffff;
  --surface-2:#eef3ec;  /* sauge très clair */
  --fg:#15241a;         /* presque noir forêt */
  --muted:#667a68;      /* vert-gris */
  --line:#e5ece2;
  --brand:#2e8b57;      /* vert club (lisible, texte blanc OK) */
  --brand-soft:#e4f3e1; /* remplissage vert doux */
  --brand-ink:#063e0b;  /* vert forêt foncé — titres/forts */
  --accent:#4fb86a;     /* vert vif club */
  --accent-soft:#e7f8e3;
  --ok:#2e9e5b;
  --ok-soft:#e2f4e5;
  --warn:#c98a12;
  --warn-soft:#f8ecca;
  --danger:#d6453f;
  --danger-soft:#fbe4e2;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 10px 30px -14px rgba(10,40,20,.26);
  --font-display:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",sans-serif;
  --font-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#071a0c; --bg:#0a1a0e; --surface:#122018; --surface-2:#1a2c20;
  --fg:#e9f3ea; --muted:#9bb49f; --line:#223528; --brand:#5cc47e; --brand-soft:#15321f; --brand-ink:#9fe6b2;
  --accent:#6fd389; --accent-soft:#163020; --ok:#4fc27e; --ok-soft:#133a26;
  --warn:#e2b545; --warn-soft:#3a2f10; --danger:#ef6a63; --danger-soft:#3a1a18;
  --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#071a0c; --bg:#0a1a0e; --surface:#122018; --surface-2:#1a2c20;
  --fg:#e9f3ea; --muted:#9bb49f; --line:#223528; --brand:#5cc47e; --brand-soft:#15321f; --brand-ink:#9fe6b2;
  --accent:#6fd389; --accent-soft:#163020; --ok:#4fc27e; --ok-soft:#133a26;
  --warn:#e2b545; --warn-soft:#3a2f10; --danger:#ef6a63; --danger-soft:#3a1a18;
  --shadow:0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb,var(--brand) 14%,transparent), transparent 60%),
  var(--bg);
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
input,select{font-family:inherit;font-size:15px}

/* App shell = phone frame */
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--surface);
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px var(--line);overflow:hidden}
@media(min-width:472px){.app{margin:18px auto;min-height:calc(100% - 36px);border-radius:30px}}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:14px max(16px,env(safe-area-inset-left,0)) 12px max(16px,env(safe-area-inset-right,0));min-height:56px}
.topbar .back{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:10px;
  color:var(--fg);font-size:17px;display:grid;place-items:center;flex:none}
.topbar h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .step{font-size:12px;color:var(--muted);font-weight:600;flex:none}

/* Screen scroll area */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;
  padding:18px max(16px,env(safe-area-inset-left,0)) 26px max(16px,env(safe-area-inset-right,0))}
.screen.flush{padding-left:0;padding-right:0}
[hidden]{display:none!important}

/* Typographic bits */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.lead{color:var(--muted);font-size:14.5px;margin:6px 0 0}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:none;border-radius:14px;padding:15px 18px;font-size:15.5px;font-weight:700;
  background:var(--brand);color:#fff;letter-spacing:-.01em}
.btn.accent{background:var(--accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:10px 14px;font-size:13.5px;width:auto;border-radius:11px}
.btn.outline{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card+.card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* Home hero */
.hero{color:#fff;border-radius:26px;padding:26px 22px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#063e0b,#1f7a43 58%,#2e8b57);box-shadow:var(--shadow)}
.hero .ball{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:conic-gradient(from 20deg,#83dc7a,#c7f3bf,#4fb86a,#83dc7a);opacity:.85;filter:blur(2px)}
.hero h1{font-size:29px;line-height:1.04;color:#fff;position:relative;font-weight:800}
.hero p{position:relative;margin:10px 0 0;color:#dbf1e2;font-size:14.5px;max-width:26ch}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo .mark{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(10,40,20,.08);
  display:grid;place-items:center;overflow:hidden;flex:none}
.logo .mark img{width:84%;height:84%;object-fit:contain;display:block}
.logo .mark.plain{background:transparent}
.logo .mark.plain img{width:100%;height:100%}

/* Entry tiles */
.entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--radius);padding:17px;color:var(--fg)}
.entry .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.entry b{font-family:var(--font-display);font-size:16px}
.entry small{color:var(--muted);display:block;margin-top:2px}
.entry .chev{margin-left:auto;color:var(--muted);font-size:20px}

/* Form fields */
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--fg)}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.pwd-wrap{position:relative;display:block}
.pwd-wrap input{padding-right:46px}
.pwd-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border:none;background:transparent;color:var(--muted);cursor:pointer;border-radius:9px;padding:0}
.pwd-eye:hover{color:var(--brand);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Stepper (number controls) */
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:46px;border:none;background:var(--surface-2);color:var(--fg);font-size:20px;font-weight:700}
.stepper input{flex:1;min-width:0;text-align:center;border:none;font-weight:800;font-size:17px;background:var(--surface);color:var(--fg);
  font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}

/* Toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:none}
.toggle b{font-weight:600;font-size:14.5px}
.toggle small{color:var(--muted);display:block;font-size:12.5px}
.sw{width:48px;height:28px;border-radius:20px;background:var(--line);border:none;position:relative;flex:none;transition:.18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--brand)}
.sw.on::after{left:23px}

/* Progress bar for wizard */
.wiz-prog{display:flex;gap:5px;padding:0 max(16px,env(safe-area-inset-left,0));margin-top:-2px;margin-bottom:2px}
.wiz-prog span{flex:1;height:4px;border-radius:3px;background:var(--line)}
.wiz-prog span.done{background:var(--brand)}
.wiz-prog span.cur{background:var(--accent)}

/* Chips / badges */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);color:var(--muted)}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap;flex:none}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.wait{background:var(--surface-2);color:var(--muted)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.brand{background:var(--brand-soft);color:var(--brand)}
.note-brand{display:block;background:var(--brand-soft);color:var(--brand);font-size:12.5px;font-weight:700;
  line-height:1.45;padding:9px 12px;border-radius:12px}

/* Gym block */
.gymhead{display:flex;align-items:center;gap:9px;margin:18px 0 10px}
.gymhead .dot{width:10px;height:10px;border-radius:50%;flex:none}
.gymhead h3{font-size:15px}
.gymhead .count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.gymblock{border:1px solid var(--line);border-left:5px solid var(--gc,var(--brand));border-radius:16px;padding:12px 12px 14px;margin-top:16px;background:color-mix(in srgb, var(--gc,var(--brand)) 7%, var(--surface))}
.gymblock .gymhead{margin:2px 2px 12px}
.gymblock .badge-gym{display:inline-flex;align-items:center;gap:7px;background:var(--gc,var(--brand));color:#fff;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13.5px;font-family:var(--font-display);letter-spacing:-.01em}

/* Pool card */
.pool{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pool+.pool{margin-top:10px}
.pool .ph{display:flex;align-items:center;gap:8px;padding:11px 13px;background:var(--surface-2);font-weight:800;font-family:var(--font-display)}
.pool .ph .tn{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.pool ul{list-style:none;margin:0;padding:4px 0}
.pool li{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;font-size:14px}
.pool li .lvdot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.pool li .tinfo{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.pool li .tinfo .tname{font-weight:600;line-height:1.3;word-break:break-word}
.pool li .tinfo .lvtag{font-size:11px;font-weight:700}
.pool li .tinfo .movepool{align-self:flex-start;margin-top:1px}
.pool li .seed{width:22px;height:22px;border-radius:7px;background:var(--brand-soft);color:var(--brand);
  font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}

/* Standings table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:center;padding:8px 4px;font-weight:700}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px}
.tbl td{padding:10px 4px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-weight:600}
.tbl tr.qual td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--surface-2);
  font-size:11px;font-weight:800;margin-right:7px}
.rk.top{background:var(--ok-soft);color:var(--ok)}

/* Match card */
.match{border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.match+.match{margin-top:10px}
/* Sections « Mes matchs » (capitaine) */
.mm-sep{margin:24px 0 10px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.mm-sep.first{border-top:none;padding-top:0;margin-top:16px}
.mm-sep .ic{display:inline-flex;align-items:center;font-size:16px}
.ref-panel{border:2px solid var(--brand);background:var(--brand-soft);border-radius:18px;padding:13px 13px 6px;margin-top:18px}
.ref-panel .rp-head{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;
  font-size:15.5px;color:var(--brand);letter-spacing:-.01em}
.ref-panel .rp-sub{font-size:12px;color:var(--brand);opacity:.9;margin:7px 0 11px;line-height:1.45;font-weight:600}
.match .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-weight:700}
.match .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.match .teams .t{font-weight:700;font-size:14px}
.match .teams .t.right{text-align:right}
.match .teams .sc{font-family:var(--font-display);font-weight:800;font-size:20px;display:flex;gap:6px;align-items:center;
  font-variant-numeric:tabular-nums}
.match .teams .sc .vs{color:var(--muted);font-size:13px;font-weight:700}

/* Score entry big inputs */
.scorebox{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:8px 0}
.scorebox .tlab{font-weight:800;font-family:var(--font-display);font-size:15px;text-align:center}
.scorebox .num{width:100%;height:84px;border:2px solid var(--line);border-radius:16px;text-align:center;
  font-family:var(--font-display);font-weight:800;font-size:40px;background:var(--surface);color:var(--fg);
  font-variant-numeric:tabular-nums}
.scorebox .num:focus{outline:none;border-color:var(--brand)}
.scorebox .dash{color:var(--muted);font-size:24px;font-weight:800}
.scorebox .setlab{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:-4px}

/* QR */
.qrwrap{display:grid;place-items:center;gap:16px;padding:24px 0}
.qrcard{background:#fff;padding:18px;border-radius:22px;box-shadow:var(--shadow)}
#qrcode img,#qrcode canvas{display:block;border-radius:6px}
.joincode{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.18em;
  background:var(--surface-2);padding:10px 18px;border-radius:12px}

/* Bottom tab bar */
.tabbar{position:sticky;bottom:0;z-index:20;display:flex;background:var(--surface);
  border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-left,0)) calc(8px + env(safe-area-inset-bottom,0)) max(10px,env(safe-area-inset-right,0))}
.tabbar button{flex:1;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:5px 2px;border-radius:12px}
.tabbar button .ti{font-size:20px;line-height:1}
.tabbar button.on{color:var(--brand)}

/* Bracket */
.bracket{--bgap:22px;display:flex;align-items:stretch;overflow-x:auto;padding:4px 2px 12px}
.round{display:flex;flex-direction:column;flex:0 0 var(--rw,150px);min-width:var(--rw,150px)}
.round:not(:last-child){padding-right:var(--bgap)}
.round h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;margin:0 0 8px;height:14px}
.rmatches{flex:1;display:flex;flex-direction:column}
.rmatch{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative}
.bm{border:1px solid var(--line);border-radius:11px;overflow:hidden;font-size:12.5px;background:var(--surface);margin:7px 0}
.bm .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 11px;min-height:36px}
.bm .r+.r{border-top:1px solid var(--line)}
.bm .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bm .sc{display:flex;gap:7px;flex:none}
.bm .sc b{display:inline-block;min-width:15px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.bm .r.win{background:var(--ok-soft)}
.bm .r.win .nm{font-weight:800}
.bm .r.win .sc b{color:var(--fg)}
.round:not(:last-child) .rmatch::after{content:'';position:absolute;top:50%;left:100%;width:calc(var(--bgap)/2);height:2px;margin-top:-1px;background:var(--line)}
.round:not(:last-child) .rmatch::before{content:'';position:absolute;left:calc(100% + var(--bgap)/2);width:calc(var(--bgap)/2);border-left:2px solid var(--line)}
.round:not(:last-child) .rmatch:nth-child(odd)::before{top:50%;bottom:0;border-bottom:2px solid var(--line)}
.round:not(:last-child) .rmatch:nth-child(even)::before{top:0;bottom:50%;border-top:2px solid var(--line)}

/* Segmented control */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:6px 0 14px}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* Phase flow */
.phase{display:flex;gap:12px;align-items:flex-start}
.phase .num{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);
  font-weight:800;display:grid;place-items:center;flex:none;font-family:var(--font-display)}
.phase+.phase{margin-top:14px}
.phase b{font-family:var(--font-display);font-size:15px}
.phase small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.phase .line{width:2px;background:var(--line);margin:4px auto 0;height:14px}

/* Toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:60;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;max-width:360px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
:root[data-theme="dark"] .toast,:root:not([data-theme="light"]) .toast{background:#000}

.demo-note{font-size:11.5px;color:var(--muted);text-align:center;padding:10px 20px 2px}
.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.summary-row:first-child{border-top:none}
.summary-row b{font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
.list-item+.list-item{margin-top:10px}
.tour{margin-top:10px}
.tour-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:inherit;font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:9px;cursor:pointer}
.tbtn:hover{color:var(--fg);border-color:var(--muted)}
.tcard{cursor:pointer}
.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:30px}
.empty p{font-size:13.5px;font-weight:600;margin:12px 0 0;line-height:1.5}
.list-item .ic{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:19px;flex:none}
.list-item b{font-family:var(--font-display);font-size:15px}
.list-item small{color:var(--muted);display:block}
.list-item .chev{margin-left:auto;color:var(--muted)}
.list-item .ic.has-img{background:none;padding:0;overflow:hidden}
.list-item .ic.has-img img{width:100%;height:100%;object-fit:cover}
.phase-mini{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:11px;font-weight:800;color:var(--brand)}
.phase-mini .bars{display:inline-flex;gap:3px}
.phase-mini .ps{width:15px;height:5px;border-radius:3px;background:var(--line)}
.phase-mini .ps.done{background:var(--ok)}

<script>
/* ---------- API OVH (PHP + MySQL, même domaine) ----------
   Tout passe par ./api/ : authentification par cookie de session, aucune
   clé ni CORS. window.api est un petit client fetch ; window.sb reste un
   simple drapeau « backend disponible » pour le reste du code. */
window.API_BASE = './api/';
window.api = (function(){
  async function call(action, opts){
    opts = opts || {};
    let url = API_BASE + '?action=' + encodeURIComponent(action);
    if(opts.query){ for(const k in opts.query){ const v=opts.query[k]; if(v!=null) url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(v); } }
    const init = { method: opts.method || (opts.body!==undefined ? 'POST' : 'GET'),
                   headers:{}, credentials:'same-origin' };
    if(opts.body!==undefined){ init.headers['Content-Type']='application/json'; init.body=JSON.stringify(opts.body); }
    let res;
    try{ res = await fetch(url, init); }
    catch(e){ const err=new Error('Réseau indisponible'); err.network=true; throw err; }
    let data=null; try{ data = await res.json(); }catch(_){}
    if(!res.ok){ const err=new Error((data&&data.error)||('Erreur '+res.status)); err.status=res.status; throw err; }
    return data;
  }
  return {
    call,
    login:          (email,password)=> call('auth.login',  {body:{email,password}}),
    logout:         ()=>               call('auth.logout', {method:'POST'}),
    me:             ()=>               call('auth.me'),
    changePassword: (password)=>       call('auth.changePassword', {body:{password}}),
    listTournaments:()=>               call('tournaments.list'),
    saveTournament: (id,row)=>         call('tournaments.save',        {body:{id,row}}),
    setArchived:    (id,archived)=>    call('tournaments.setArchived', {body:{id,archived}}),
    setStatus:      (id,status,extra)=> call('tournaments.setStatus',  {body:Object.assign({id,status},extra||{})}),
    removeTournament:(id)=>            call('tournaments.remove',      {body:{id}}),
    saveStructure:  (tid,s)=>          call('tournaments.saveStructure',{body:{tid,s}}),
    loadStructure:  (tid)=>            call('tournaments.loadStructure',{query:{tid}}),
    listReferents:  ()=>               call('referents.list'),
    createReferent: (name,email,password)=> call('referents.create',   {body:{name,email,password}}),
    setReferentStatus:(id,status)=>    call('referents.setStatus',     {body:{id,status}}),
    removeReferent: (id)=>             call('referents.remove',        {body:{id}}),
  };
})();
// Drapeau « backend présent » : le code existant teste window.sb un peu partout.
window.sb = { _ovh:true };
</script>
<script>
/* ---------- Couche données (API OVH) ----------
   Persiste les tournois dans la table `tournaments`. `config` (texte JSON)
   porte tout le paramétrage de l'app ; on y range aussi gymnases / équipes /
   étape du brouillon (_gyms, _teams, _step) pour un aller-retour fidèle. Les
   colonnes name / event_date / place / status / join_code / live_phase sont
   tenues à jour en parallèle (affichage + requêtes). */
(function(){
  if(!window.api){ window.vboDb = null; return; }
  const isUuid = (v)=> typeof v==='string'
    && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v);
  function toISODate(d){
    if(!d) return null;
    if(typeof d==='string' && /^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10);
    const t=Date.parse(d); return isNaN(t) ? null : new Date(t).toISOString().slice(0,10);
  }
  // objet tournoi (app) -> ligne vbo.tournaments
  function toRow(t){
    const cfg = Object.assign({}, t.config||{});
    cfg._gyms  = t.gyms  || [];
    cfg._teams = t.teams || [];
    cfg._step  = t.step  || 0;
    return {
      name:       (t.config&&t.config.name)  || 'Tournoi',
      event_date: toISODate(t.config&&t.config.date),
      place:      (t.config&&t.config.place) || null,
      status:     t.status   || 'draft',
      archived:   !!t.archived,
      join_code:  t.joinCode || null,
      live_phase: t.livePhase|| 'brassage',
      config:     cfg,
    };
  }
  // ligne vbo.tournaments -> objet tournoi (app)
  function fromRow(r){
    const cfg = Object.assign({}, r.config||{});
    const gyms = cfg._gyms || [], teams = cfg._teams || [], step = cfg._step || 0;
    delete cfg._gyms; delete cfg._teams; delete cfg._step;
    if(!cfg.name  && r.name)       cfg.name  = r.name;
    if(!cfg.date  && r.event_date) cfg.date  = r.event_date;
    if(!cfg.place && r.place)      cfg.place = r.place;
    return {
      id: r.id,
      status: r.status || 'draft',
      archived: !!r.archived,
      config: cfg, gyms, teams, step,
      joinCode: r.join_code || null,
      livePhase: r.live_phase || 'brassage',
      launchedAt: r.launched_at ? Date.parse(r.launched_at) : undefined,
      closedAt:   r.closed_at   ? Date.parse(r.closed_at)   : undefined,
      savedAt:    r.created_at  ? Date.parse(r.created_at)  : undefined,
      _sb: true,
    };
  }
  window.vboDb = {
    isUuid, fromRow,
    async list(){
      const rows = await api.listTournaments();
      return (rows||[]).map(fromRow);
    },
    // Enregistre : INSERT si l'id local n'est pas un uuid, sinon UPDATE.
    // Renvoie l'id définitif (uuid DB) pour réconcilier l'objet local.
    async save(t, extra){
      const row = Object.assign(toRow(t), extra||{});
      const res = await api.saveTournament(isUuid(t.id) ? t.id : null, row);
      return res.id;
    },
    async setArchived(id, archived){
      if(!isUuid(id)) return;
      await api.setArchived(id, !!archived);
    },
    async setStatus(id, status, extra){
      if(!isUuid(id)) return;
      await api.setStatus(id, status, extra||{});
    },
    async remove(id){
      if(!isUuid(id)) return;
      await api.removeTournament(id);
    },
    // Persiste la structure du tournoi (gymnases, équipes, poules, matchs de
    // brassage). Le serveur efface l'ancienne et réinsère tout, et fait tout
    // le mapping des clés ; ici on ne fait que transporter `s`.
    // `s` = { gyms:[{key,name,position}], teams:[{key,name,levelW}],
    //         pools:[{letter,phase,gymKey,court,teamKeys:[]}],
    //         matches:[{round,time,phase,poolKey,gymName,court,aKey,bKey,refKey}] }
    async saveStructure(tid, s){
      if(!isUuid(tid)) throw new Error('Tournoi non encore enregistré.');
      return await api.saveStructure(tid, s);
    },
    // Relit la structure persistée ; le serveur renvoie déjà les formes
    // attendues par l'app ({ pools, schedule }), ou null si rien n'est persisté.
    async loadStructure(tid){
      if(!isUuid(tid)) return null;
      return await api.loadStructure(tid);
    },
  };
})();
</script>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rebuildPools(){
  const P=state.config.pools, T=state.config.teamsPerPool, G=state.config.gyms;
  const cpg=state.config.courtsPerGym||[];
  const pools=[];
  for(let i=0;i<P;i++) pools.push({letter:POOL_LETTERS[i]||('P'+(i+1)), gym:null, court:1, teams:[]});
  const perGym=Math.ceil(P/G);
  // Chaque gymnase a ses propres terrains, numérotés 1..N dans chaque gymnase
  const gymCourts=[];
  for(let gi=0;gi<G;gi++) gymCourts.push(Math.max(1, cpg[gi]||1));
  pools.forEach((p,i)=>{
    const gi=Math.min(G-1, Math.floor(i/perGym));
    p.gym = GYMS[gi].id;
    const idxInGym = i - gi*perGym;              // rang de la poule dans son gymnase
    p.court = (idxInGym % gymCourts[gi]) + 1;    // terrains locaux au gymnase : 1, 2, 3…
  });
  // Liste des terrains disponibles par gymnase (pour le sélecteur manuel)
  state.courtsByGym={};
  for(let gi=0;gi<G;gi++){ state.courtsByGym[GYMS[gi].id]=Array.from({length:gymCourts[gi]},(_,k)=>k+1); }
  // On part des équipes inscrites avec leur niveau
  let order = state.teams.slice(0, P*T).map(x=>({t:x.name, level:x.level}));
  if(state.config.distribution==='random') shuffle(order);
  else if(state.config.distribution==='snake') order.sort((a,b)=> levelMeta(b.level).w - levelMeta(a.level).w); // tête de série = niveau le plus fort
  if(state.config.distribution==='manual'){
    order.forEach((o,idx)=> pools[Math.floor(idx/T)].teams.push(o));
  } else {
    // Serpentin : poule A←nº1, B←nº2 … puis on repart en sens inverse
    let idx=0;
    for(let r=0;r<T;r++){
      const seq = r%2===0 ? [...Array(P).keys()] : [...Array(P).keys()].reverse();
      for(const pi of seq){ if(idx<order.length) pools[pi].teams.push(order[idx++]); }
    }
  }
  state.pools=pools;
  state.phasePrincipal=null; state.phaseConsolante=null; // recalculées à la demande
  buildSchedule();
}

function roundRobin(list){
  const a=list.slice(); if(a.length%2) a.push(null);
  const n=a.length, rounds=[];
  for(let r=0;r<Math.max(0,n-1);r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){ if(a[i]&&a[n-1-i]) pairs.push([a[i],a[n-1-i]]); }
    rounds.push(pairs);
    a.splice(1,0,a.pop());
  }
  return rounds;
}

// Vainqueur d'un match (jamais de nul au volley) : d'abord les sets gagnés,
// puis, si le nombre de sets est pair et qu'on est à égalité de sets, le total de points.
// Renvoie 'a', 'b', ou null si le match n'est pas joué.
function matchWinner(m){
  const sets=(m.sets&&m.sets.length)?m.sets : (m.sa!=null?[[m.sa,m.sb]]:null);
  if(!sets) return null;
  let wa=0, wb=0, ta=0, tb=0;
  for(const [a,b] of sets){ if(a==null||b==null) continue; ta+=a; tb+=b; if(a>b) wa++; else if(b>a) wb++; }
  if(wa!==wb) return wa>wb?'a':'b';
  return ta>=tb?'a':'b'; // départage au total de points marqués
}

// Arbitrage : à chaque tour, une équipe au repos arbitre un match.
// Contraintes : un arbitre ne joue pas ce tour-là, arbitre au plus un match par tour,
// et arbitre uniquement dans le gymnase où son équipe joue.
function assignReferees(sched, pools){
  const teamGym={}; // chaque équipe est rattachée au gymnase où elle joue
  sched.forEach(m=>{ if(m.a) teamGym[m.a]=m.gym; if(m.b) teamGym[m.b]=m.gym; });
  const refCount={}; // nb de matchs déjà arbitrés par équipe (pour l'équité)
  Object.keys(teamGym).forEach(t=>{ refCount[t]=0; });
  const byR={};
  sched.forEach(m=>{ (byR[m.r]=byR[m.r]||[]).push(m); });
  Object.keys(byR).sort((a,b)=>a-b).forEach(r=>{
    const matches=byR[r];
    const playing=new Set();
    matches.forEach(m=>{ playing.add(m.a); playing.add(m.b); });
    // arbitres disponibles ce tour, regroupés par gymnase
    const idleByGym={};
    Object.keys(teamGym).forEach(t=>{ if(!playing.has(t)){ const g=teamGym[t]; (idleByGym[g]=idleByGym[g]||[]).push(t); } });
    const usedThisRound=new Set();
    matches.forEach(m=>{
      const pool=(idleByGym[m.gym]||[]).filter(t=>!usedThisRound.has(t));
      // on choisit l'équipe au repos qui a le MOINS arbitré jusqu'ici (équité)
      pool.sort((a,b)=> (refCount[a]-refCount[b]) || a.localeCompare(b));
      const pick=pool[0]||null;
      m.ref=pick; // même gymnase que le match, sinon pas d'arbitre
      if(pick){ refCount[pick]++; usedThisRound.add(pick); }
    });
  });
}
// Mode « rotation » : chaque tour remplit TOUS les terrains disponibles de chaque gymnase.
// Les matchs d'une même poule (qui n'opposent jamais deux fois la même équipe dans un tour)
// peuvent occuper plusieurs terrains si le gymnase en a plus que de poules.
function makeScheduleRotation(pools){
  const sched=[];
  const byGym={};
  pools.forEach(p=>{ (byGym[p.gym]=byGym[p.gym]||[]).push(p); });
  const gymIndex=id=>GYMS.findIndex(g=>g.id===id);
  Object.keys(byGym).sort((a,b)=>gymIndex(a)-gymIndex(b)).forEach(gym=>{
    const courts=gymCourtList(gym, pools);
    const C=courts.length;
    const queues=byGym[gym].map(p=>({p, rounds:roundRobin(p.teams.map(x=>x.t)), ri:0, off:0}));
    const K=queues.length;
    const cap=Math.max(1, Math.ceil(C/Math.max(1,K))); // nb de terrains qu'une poule peut occuper par tour
    let tour=0, guard=0;
    while(queues.some(q=>q.ri<q.rounds.length) && guard++<1000){
      tour++;
      let ci=0;
      const rot=(K>C)?(tour-1):0; // on ne fait tourner l'ordre des poules que si elles doivent se partager les terrains
      for(let s=0; s<K && ci<C; s++){
        const q=queues[(rot+s)%K];
        if(q.ri>=q.rounds.length) continue;
        const round=q.rounds[q.ri];
        let placed=0;
        while(q.off<round.length && ci<C && placed<cap){
          const [a,b]=round[q.off++]; placed++;
          const court=courts[ci++];
          const sc=demoScore(court, tour);
          sched.push({r:tour, time:slotTime(tour), gym:gymName(gym), court, pool:q.p.letter, a, b, sa:sc.sa, sb:sc.sb, sets:sc.sets, status:sc.status});
        }
        if(q.off>=round.length){ q.ri++; q.off=0; } // la poule ne démarre pas un 2e tour dans le même créneau
      }
    }
  });
  sched.sort((x,y)=> x.r-y.r || (x.gym<y.gym?-1:x.gym>y.gym?1:0) || x.court-y.court);
  return sched;
}
// Mode « poule par poule » : une poule occupe tous les terrains de son gymnase pour un tour, puis l'autre poule
function makeSchedulePool(pools){
  const sched=[];
  const byGym={};
  pools.forEach(p=>{ (byGym[p.gym]=byGym[p.gym]||[]).push(p); });
  const gymPlans={}; let maxTours=0;
  Object.keys(byGym).forEach(gym=>{
    const courts=gymCourtList(gym, pools);
    const poolRounds=byGym[gym].map(p=>({p, rounds:roundRobin(p.teams.map(x=>x.t)), idx:0}));
    const groups=[]; // chaque groupe = les matchs d'un même tour sur ce gymnase
    let remaining=poolRounds.reduce((a,q)=>a+q.rounds.length,0), gi=0, guard=0;
    while(remaining>0 && guard++<500){
      let picked=null;
      for(let t=0;t<poolRounds.length;t++){ const q=poolRounds[(gi+t)%poolRounds.length]; if(q.idx<q.rounds.length){ picked=q; gi=(gi+t+1)%poolRounds.length; break; } }
      if(!picked) break;
      const round=picked.rounds[picked.idx++]; remaining--;
      // si la poule a plus de matchs simultanés que de terrains, on découpe en sous-tours
      for(let off=0; off<round.length; off+=courts.length){
        const chunk=round.slice(off, off+courts.length);
        groups.push(chunk.map((pair,ci)=>({pool:picked.p, pair, court:courts[ci]})));
      }
    }
    gymPlans[gym]=groups; maxTours=Math.max(maxTours, groups.length);
  });
  for(let t=0;t<maxTours;t++){
    Object.keys(gymPlans).forEach(gym=>{
      const grp=gymPlans[gym][t]; if(!grp) return;
      grp.forEach(({pool,pair,court})=>{
        const [a,b]=pair; const sc=demoScore(court, t+1);
        sched.push({r:t+1, time:slotTime(t+1), gym:gymName(gym), court, pool:pool.letter, a, b, sa:sc.sa, sb:sc.sb, sets:sc.sets, status:sc.status});
      });
    });
  }
  sched.sort((x,y)=> x.r-y.r || (x.gym<y.gym?-1:x.gym>y.gym?1:0) || x.court-y.court);
  return sched;
}

/* ---------- Phase 2 (Principale / Consolante) & phases finales ---------- */
function distributeCourts(pools, forceGym){
  const G=state.config.gyms, cpg=state.config.courtsPerGym||[];
  if(forceGym!=null){ // toute la catégorie dans un seul gymnase
    const gi=Math.min(G-1, forceGym), c=Math.max(1, cpg[gi]||1);
    pools.forEach((p,i)=>{ p.gym=GYMS[gi].id; p.court=(i%c)+1; });
    return;
  }
  const P=pools.length, perGym=Math.ceil(P/Math.max(1,G));
  const gymCourts=[];
  for(let gi=0;gi<G;gi++) gymCourts.push(Math.max(1,cpg[gi]||1));
  pools.forEach((p,i)=>{ const gi=Math.min(G-1,Math.floor(i/perGym)); p.gym=GYMS[gi].id; const k=i-gi*perGym; p.court=(k%gymCourts[gi])+1; });
}
function snakeSeed(order,P,T){
  const pools=[]; for(let i=0;i<P;i++) pools.push({letter:POOL_LETTERS[i]||('P'+(i+1)),gym:null,court:1,teams:[]});
  let idx=0;
  for(let r=0;r<T;r++){ const seq=r%2===0?[...Array(P).keys()]:[...Array(P).keys()].reverse(); for(const pi of seq){ if(idx<order.length) pools[pi].teams.push(order[idx++]); } }
  return pools;
}
// 1ers & 2es de chaque poule → Principale ; le reste → Consolante
function splitQualifiers(pools){
  const principal=[], consolante=[];
  (pools||[]).forEach(p=>{
    poolStandingRows(p).forEach((r,i)=>{
      const lvl=(p.teams.find(x=>x.t===r.t)||{}).level||'dep';
      (i<2?principal:consolante).push({t:r.t, level:lvl, seed:i, from:p.letter});
    });
  });
  return {principal, consolante};
}
function makeCategory(teams, forceGym){
  const T=state.config.teamsPerPool||4;
  const order=teams.slice().sort((a,b)=> a.seed-b.seed); // têtes de série (1ers) d'abord
  const P=Math.max(1, Math.round(order.length/T)||1);
  const pools=snakeSeed(order, P, Math.ceil(order.length/Math.max(1,P)));
  distributeCourts(pools, forceGym);
  return {pools, schedule:makeSchedule(pools, horaireFor('poules2'))};
}
function buildPhase2(){
  const q=splitQualifiers(state.pools);
  // Option : Principale dans le gymnase 1, Consolante dans le gymnase 2 (un organisateur par gymnase)
  const split = !!state.config.splitPhase2ByGym && state.config.gyms>=2 && state.config.phaseConsolante;
  state.phasePrincipal=makeCategory(q.principal, split?0:undefined);
  // Consolante désactivée : les 3es–4es sont éliminés, pas de second tableau
  state.phaseConsolante = state.config.phaseConsolante ? makeCategory(q.consolante, split?1:undefined) : {pools:[], schedule:[]};
}
function ensurePhases(){ if(!state.phasePrincipal||!state.phaseConsolante) buildPhase2(); }
function phaseData(key){ ensurePhases(); return key==='principal'?state.phasePrincipal : key==='consolante'?state.phaseConsolante : {pools:state.pools, schedule:state.schedule}; }
// Bracket seedé depuis le classement global d'une catégorie (phase 2)
function seedOrder(n){ let r=[0]; while(r.length<n){ const m=r.length*2; const nr=[]; r.forEach(s=>{nr.push(s);nr.push(m-1-s);}); r=nr; } return r; }
function categoryRanking(cat){
  const rows=[]; cat.pools.forEach(p=> poolStandingRows(p).forEach(r=> rows.push(r)) );
  rows.sort((a,b)=> b.pts-a.pts || (b.pf-b.pc)-(a.pf-a.pc) || a.t.localeCompare(b.t));
  return rows;
}
function roundNames(K){ const names=[]; let n=K; while(n>1){ names.push(n===2?'Finale':'1/'+(n/2)); n/=2; } return names; }
function buildBracket(cat){
  const rank=categoryRanking(cat);
  let autoK=1; while(autoK*2<=rank.length) autoK*=2; autoK=Math.max(2,autoK);
  const fs=state.config.finalStart||'auto';
  // Choix manuel (16=1/8, 8=1/4, 4=1/2) borné au nombre réel de qualifiés
  let K = fs==='auto' ? autoK : Math.min(+fs||autoK, autoK);
  K=Math.max(2,K);
  const seeds=rank.slice(0,K).map(r=>r.t);
  const order=seedOrder(K);
  const first=[]; for(let i=0;i<K/2;i++){ first.push([seeds[order[2*i]], seeds[order[2*i+1]]]); }
  return {K, first, seeds};
}
// Simulation de démo : la meilleure tête de série l'emporte à chaque tour.
// Produit l'arbre complet, le champion/finaliste, et la petite finale (3ᵉ place)
// disputée par les deux perdants des demi-finales.
function simulateBracket(br){
  const strength=t=>{ const i=(br.seeds||[]).indexOf(t); return i<0?999:i; };
  const mk=(x,y)=> strength(x)<=strength(y)?{a:x,b:y}:{a:y,b:x}; // mieux classé à gauche = vainqueur (démo)
  let round=br.first.map(([a,b])=>mk(a,b));
  const rounds=[round];
  while(round.length>1){
    const next=[]; for(let i=0;i<round.length;i+=2){ next.push(mk(round[i].a, round[i+1].a)); }
    round=next; rounds.push(round);
  }
  const final=rounds[rounds.length-1][0];
  let third=null, fourth=null, hasSemis=false, petite=null;
  if(br.K>=4){
    const semis=rounds[rounds.length-2];
    if(semis.length===2){ hasSemis=true; petite=mk(semis[0].b, semis[1].b); third=petite.a; fourth=petite.b; }
  }
  return {rounds, champion:final.a, runnerUp:final.b, third, fourth, hasSemis, petite};
}

  navStack.pop();
  const prev = navStack[navStack.length-1] || {screen:'home',opts:{}};

}

function setTop(title, {back=true, step=null, prog=null}={}){
  if(title===null){ topbar.hidden=true; wizProg.hidden=true; return; }
  topbar.hidden=false;
  document.getElementById('topTitle').textContent=title;
  document.getElementById('backBtn').style.visibility = back?'visible':'hidden';
  document.getElementById('topStep').textContent = step||'';
  if(prog){ wizProg.hidden=false; wizProg.innerHTML = prog.map((c)=>`<span class="${c}"></span>`).join(''); }
  else wizProg.hidden=true;
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function tournPhaseInfo(t){
  const order=phaseOrder(t.config);
  const names={brassage:'Brassage', poules2:'Principale & Consolante', finales:'Phases finales'};
  let p=t.livePhase||'brassage';
  if(order.indexOf(p)<0) p=order[order.length-1]; // livePhase hors du déroulé (ex. poules2 sans consolante)
  const i=Math.max(0,order.indexOf(p));
  return {i, total:order.length, name:names[p]||'Brassage'};
}
function tournCard(t){
  const archived=state.dashView==='archived';
  const st=TOURN_ST[t.status]||TOURN_ST.draft;
  const sub = t.status==='draft'
    ? `${t.config.teams||'?'} équipes · ${fmtDate(t.config.date)} · étape ${Math.min((t.step||0)+1,CREATE_STEPS.length)}/${CREATE_STEPS.length} · ${CREATE_STEPS[Math.min(t.step||0,CREATE_STEPS.length-1)]}`
    : `${t.config.teams||'?'} équipes · ${fmtDate(t.config.date)}`;
  let phaseLine='';
  if(t.status==='live'){
    const ph=tournPhaseInfo(t);
    const bars=Array.from({length:ph.total},(_,i)=>`<span class="ps ${i<ph.i?'done':i===ph.i?'cur':''}"></span>`).join('');
    phaseLine=`<span class="phase-mini"><span class="bars">${bars}</span>Phase ${ph.i+1}/${ph.total} · ${ph.name}</span>`;
  }
  const open = t.status==='draft' ? `resumeDraft('${t.id}')` : `openTournament('${t.id}')`;
  let actions='';
  if(archived){
    actions=`<button class="tbtn" onclick="event.stopPropagation();unarchiveTournament('${t.id}')">↩︎ Désarchiver</button>`;
  }else{
    if(t.status==='live') actions+=`<button class="tbtn" onclick="event.stopPropagation();closeTournament('${t.id}')">Clôturer</button>`;
    actions+=`<button class="tbtn" onclick="event.stopPropagation();archiveTournament('${t.id}')">Archiver</button>`;
  }
  return `<div class="tour">
    <div class="list-item" style="margin:0" onclick="${open}">
      ${t.config.image
        ? `<span class="ic has-img"><img src="${t.config.image}" alt=""></span>`
        : `<span class="ic" style="background:${st.icBg};color:${st.icFg}">${st.ic}</span>`}
      <span style="min-width:0"><b>${t.config.name}</b><small>${sub}</small>${phaseLine}</span>
      <span class="badge ${st.badge}" style="margin-left:auto;flex:none">${st.label}</span>
    </div>
    <div class="tour-actions">${actions}</div>
  </div>`;
}

/* ---------- Création wizard ---------- */
let wizStep = 0;
const WIZ_STEPS = ['Infos','Format & gymnases','Règles de match','Phases'];
// Parcours complet de création (barre d'avancement commune à tous les écrans)
const CREATE_STEPS = ['Infos','Format','Règles','Phases','Inscriptions','Répartition','Lancement'];
function createProgArr(idx){ return CREATE_STEPS.map((_,i)=> i<idx?'done': i===idx?'cur':''); }
// Étape réelle du parcours de création (0-3 = wizard, 4 = inscriptions, 5 = répartition, 6 = lancement)
let createStage = 0;
function startWizard(){ wizStep=0; createStage=0; state.currentDraftId=null; go('wizard'); }
/* ----- Brouillons : sauvegarde / reprise à chaque étape ----- */
function snapshotTournament(){
  return {
    config: JSON.parse(JSON.stringify(state.config)),
    gyms: GYMS.slice(0, state.config.gyms).map(g=>g.name),
    teams: state.teams.map(t=>({name:t.name, level:t.level})),
    step: createStage,
  };
}
async function saveDraft(exit){
  saveWizard();
  const snap=snapshotTournament();
  let d=state.tournaments.find(x=>x.id===state.currentDraftId);
  if(!d){ d={id:'d'+Date.now(), status:'draft', archived:false}; state.tournaments.push(d); state.currentDraftId=d.id; }
  Object.assign(d, snap, {id:d.id, savedAt:Date.now()});
  if(!d.status) d.status='draft';
  if(window.vboDb){
    try{
      const newId = await vboDb.save(d);
      if(newId && newId!==d.id){ const old=d.id; d.id=newId; if(state.currentDraftId===old) state.currentDraftId=newId; }
    }catch(e){ console.warn('Enregistrement brouillon:', e); toast('⚠️ Enregistrement cloud échoué'); }
  }
  toast('💾 Brouillon enregistré');
  if(exit){ state._tournLoaded=false; go('dashboard'); }
}
function resumeDraft(id){
  const d=state.tournaments.find(x=>x.id===id); if(!d) return;
  Object.assign(state.config, d.config);
  (d.gyms||[]).forEach((nm,i)=>{ if(GYMS[i]) GYMS[i].name=nm; });
  state.teams = (d.teams||[]).map(t=>({name:t.name, level:t.level}));
  state.currentDraftId=id;
  const st=d.step||0; createStage=st;
  if(st<=3){ wizStep=st; go('wizard'); }
  else { wizStep=3; rebuildPools(); go(st===4?'teamsRegister':st===5?'assignPools':'summary'); }
}
// Lancement : enregistre le tournoi dans la liste (statut « En cours ») puis génère le QR
async function launchTournament(){
  saveWizard();
  if(!state.joinCode) state.joinCode=genJoinCode();
  const snap=snapshotTournament();
  let t=state.tournaments.find(x=>x.id===state.currentDraftId);
  if(!t){ t={id:'t'+Date.now()}; state.tournaments.push(t); state.currentDraftId=t.id; }
  state.livePhase='brassage';
  Object.assign(t, snap, {id:t.id, status:'live', archived:false, joinCode:state.joinCode, launchedAt:Date.now(), livePhase:'brassage'});
  if(window.vboDb){
    try{
      const newId = await vboDb.save(t, { launched_at:new Date(t.launchedAt).toISOString() });
      if(newId && newId!==t.id){ const old=t.id; t.id=newId; if(state.currentDraftId===old) state.currentDraftId=newId; }
      // Phase 2 : persiste gymnases / équipes / poules / matchs de brassage.
      if(vboDb.isUuid(t.id)){
        const gymsUsed=[...new Set(state.pools.map(p=>p.gym))];
        const structure={
          gyms: gymsUsed.map(gid=>({ key:gid, name:gymName(gid), position:Math.max(0,GYMS.findIndex(g=>g.id===gid)) })),
          teams: state.teams.map(tm=>({ key:tm.name, name:tm.name, levelW:levelMeta(tm.level).w })),
          pools: state.pools.map(p=>({ letter:p.letter, phase:'brassage', gymKey:p.gym, court:p.court, teamKeys:p.teams.map(x=>x.t) })),
          matches: (state.schedule||[]).map(m=>({ round:m.r, time:m.time, phase:'brassage', poolKey:m.pool, gymName:m.gym, court:m.court, aKey:m.a, bKey:m.b, refKey:m.ref })),
        };
        try{ await vboDb.saveStructure(t.id, structure); state.loadedStructTid=t.id; }
        catch(e){ console.warn('Persistance structure:', e); toast('⚠️ Structure non enregistrée (tournoi créé)'); }
      }
    }catch(e){ console.warn('Lancement tournoi:', e); toast('⚠️ Enregistrement cloud échoué'); }
  }
  go('qr');
}

function saveWizard(){
  const g=id=>document.getElementById(id);
  // Infos générales (étape 1)
  if(g('w_name')&&g('w_name').value.trim()) state.config.name=g('w_name').value.trim();
  if(g('w_date')&&g('w_date').value) state.config.date=g('w_date').value;
  if(g('w_place')&&g('w_place').value.trim()) state.config.place=g('w_place').value.trim();
  if(g('w_teams')) state.config.teams=+g('w_teams').value;
  if(g('w_gyms')) state.config.gyms=+g('w_gyms').value;
  if(g('w_pools')) state.config.pools=+g('w_pools').value;
  if(g('w_tpp')) state.config.teamsPerPool=+g('w_tpp').value;
  if(g('w_schedmode')){ state.config.scheduleMode=g('w_schedmode').value; const h=g('schedHint'); if(h) h.textContent = state.config.scheduleMode==='pool'?'Toute une poule joue en même temps, puis on alterne avec la poule suivante du gymnase.':'Les terrains tournent en continu, un match par terrain et par tour.'; }
  if(g('w_starttime')&&g('w_starttime').value) state.config.startTime=g('w_starttime').value;
  if(g('w_roundmin')) state.config.roundMinutes=+g('w_roundmin').value;
  if(g('w_setupmin')) state.config.setupMinutes=+g('w_setupmin').value;
  // Règles de match — phase de brassage
  if(g('b_sets')) state.config.sets=+g('b_sets').value;

  if(g('sw_conso')) state.config.phaseConsolante=g('sw_conso').classList.contains('on');
  if(g('w_finalStart')) state.config.finalStart=g('w_finalStart').value;

  document.querySelectorAll('input[id^="w_gymname_"]').forEach(el=>{ const i=+el.id.replace('w_gymname_',''); if(GYMS[i]&&el.value.trim()) GYMS[i].name=el.value.trim(); });

// Nombre de qualifiés en Principale = 1ers + 2es de chaque poule (partage par rang)
function principalQualCount(){
  const n=(state.pools||[]).reduce((s,p)=> s+Math.min(2,(p.teams||[]).length), 0);
  return n || Math.floor((C.teams||0)/2);
}
function autoFinalLabel(){
  const qual=principalQualCount();
  let K=1; while(K*2<=qual) K*=2; K=Math.max(2,K); // plus grande puissance de 2 ≤ qualifiés
  return {K, qual, label: K===2?'Finale directe':'1/'+(K/2)+' de finale ('+K+' équipes)'};
}

  GYMS.slice(0,G).forEach(g=>{
    const gp = state.pools.filter(p=>p.gym===g.id);
    if(!gp.length) return;
    const nbTeams = gp.reduce((s,p)=>s+p.teams.length,0);
    h+=`<div class="gymblock" style="--gc:${g.color}">
      <div class="gymhead"><span class="badge-gym">🏟️ ${g.name}</span>

    <button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="saveDraft(true)">💾 Enregistrer et quitter</button></div>`;
  host.innerHTML=h;
  ['ap_pools','ap_tpp'].forEach(id=>{ const el=document.getElementById(id); if(el){ el.addEventListener('live',setPoolFormat); el.addEventListener('change',setPoolFormat); } });

window.setDist=(m)=>{ state.config.distribution=m; rebuildPools(); screens.assignPools(); };
// Étape 6 : on ne valide que si la répartition est correcte
window.validateAssign=()=>{
  const n=state.teams.length, p=state.config.pools, t=state.config.teamsPerPool, cap=p*t;
  const placed=state.pools.reduce((s,pl)=>s+pl.teams.length,0);
  // On ne bloque QUE s'il y a moins de places que d'équipes (des équipes resteraient non placées).
  // Des places vides (cap > n) sont autorisées.
  if(p>1 && cap<n){ toast(`⚠ ${n-cap} équipe(s) non placée(s) — augmentez le format`); return; }
  if(placed!==n){ toast(`⚠ ${n-placed} équipe(s) ne sont pas placées`); return; }
  if(state.pools.some(pl=>pl.teams.length<2)){ toast('⚠ Chaque poule doit avoir au moins 2 équipes'); return; }
  go('summary');
};
window.setPoolFormat=()=>{
  const pEl=document.getElementById('ap_pools'), tEl=document.getElementById('ap_tpp');
  const p=Math.max(1,Math.min(16,parseInt(pEl&&pEl.value)||1));
  let t;
  if(p===1){ t=Math.max(2,state.teams.length); }                       // poule unique = championnat, toutes les équipes
  else if(tEl){ t=Math.max(2,Math.min(8,parseInt(tEl.value)||2)); }
  else { t=Math.max(2,Math.min(8,Math.ceil(state.teams.length/p))); }   // retour depuis la poule unique : format cohérent
  state.config.pools=p;
  state.config.teamsPerPool=t;
  rebuildPools(); screens.assignPools();
};
window.autoFitPools=()=>{
  const n=state.teams.length;
  const good=[4,3,5,6,2].find(t=>n%t===0 && n/t>=2 && n/t<=16);
  let tpp, pools;
  if(good){ tpp=good; pools=n/tpp; }
  else { tpp=4; pools=Math.max(2,Math.min(16,Math.ceil(n/4))); }
  state.config.teamsPerPool=tpp; state.config.pools=pools;
  rebuildPools(); screens.assignPools();
  toast('Format ajusté : '+pools+' poules × '+tpp+' équipes');
};
function updatePoolFit(){
  const el=document.getElementById('poolFit'); if(!el) return;
  const n=state.teams.length, p=state.config.pools, t=state.config.teamsPerPool, cap=p*t;
  let msg;
  if(p===1) msg=`<span class="badge ok">🏆 Poule unique — championnat : les ${n} équipes se rencontrent toutes</span>`;
  else if(cap===n) msg=`<span class="badge ok">✓ Les ${n} équipes rentrent parfaitement (${p} × ${t})</span>`;
  else if(cap>n) msg=`<span class="badge warn">⚠ ${cap} places pour ${n} équipes — ${cap-n} place(s) vide(s), poules inégales</span>`;
  else msg=`<span class="badge warn">⚠ ${cap} places pour ${n} équipes — ${n-cap} équipe(s) ne seront pas placées, augmentez le format</span>`;
  el.innerHTML=msg;
}
window.setPoolCourt=(letter,v)=>{ const p=state.pools.find(x=>x.letter===letter); if(p) p.court=+v; };
window.moveTeam=(from,name,to)=>{
  if(from===to) return;
  const pf=state.pools.find(p=>p.letter===from), pt=state.pools.find(p=>p.letter===to);
  if(!pf||!pt) return;
  const idx=pf.teams.findIndex(x=>x.t===name); if(idx<0) return;
  const [tm]=pf.teams.splice(idx,1); pt.teams.push(tm);
  state.phasePrincipal=null; state.phaseConsolante=null; buildSchedule();
  screens.assignPools(); toast(name+' → Poule '+to);
};

// Copie dans le presse-papier (avec repli pour les navigateurs/contextes sans API)
async function copyText(txt){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
window.copyJoinCode=async(code)=>{ const ok=await copyText(code); toast(ok?'✓ Code '+code+' copié':'Code : '+code); };
window.shareJoin=async(code,url)=>{
  const data={ title:C.name||'Tournoi', text:`Rejoignez le tournoi « ${C.name} » sur Tournoi VBO. Code : ${code}`, url };
  if(navigator.share){
    try{ await navigator.share(data); return; }
    catch(e){ if(e&&e.name==='AbortError') return; } // l'utilisateur a annulé le partage
  }
  const ok=await copyText(`${data.text}\n${url}`); // repli : copie du message + lien
  toast(ok?'✓ Invitation copiée — collez-la aux capitaines':'Lien : '+url);
};

function liveCourtRow(gym,label,a,b,st,m){

/* ---------- Phases du tournoi (brassage → poules2 → finales) ---------- */
const PHASE_ORDER=['brassage','poules2','finales'];
// Déroulé réel : sans Consolante, on passe directement du brassage aux phases finales (2 phases)
function phaseOrder(cfg){ const c=cfg||state.config; return c&&c.phaseConsolante===false ? ['brassage','finales'] : ['brassage','poules2','finales']; }
const PHASE_ICON={brassage:'🔄', poules2:'🏐', finales:'🏆'};
function phaseName(p){
  if(p==='poules2') return state.config.phaseConsolante ? 'Principale & Consolante' : 'Principale';
  if(p==='finales') return 'Phases finales';
  return 'Brassage';
}
function nextPhase(p){ const o=phaseOrder(); const i=o.indexOf(p); return i>=0&&i<o.length-1 ? o[i+1] : null; }
function defaultRules(){ const c=state.config; return {sets:c.sets, pointsPerSet:c.pointsPerSet, twoPointGap:c.twoPointGap, timed:c.timed, setMinutes:c.setMinutes}; }
function phaseRulesSet(p){ return p==='poules2' ? !!state.config.rules2 : p==='finales' ? !!state.config.finale : true; }
function rulesFor(p){
  if(p==='poules2') return state.config.rules2 || defaultRules();
  if(p==='finales') return state.config.finale || defaultRules();
  return state.config; // brassage
}
function setPhaseRules(p, r){ if(p==='poules2') state.config.rules2=r; else if(p==='finales') state.config.finale=r; }
// Horaire par phase : le brassage utilise l'horaire défini dans l'assistant ;
// chaque phase suivante peut avoir le sien (défaut = reprise de l'horaire du brassage).
function baseHoraire(){ const c=state.config; return {startTime:c.startTime||'09:00', roundMinutes:c.roundMinutes||20, setupMinutes:c.setupMinutes!=null?c.setupMinutes:10}; }
function horaireFor(p){
  const c=state.config;
  if(p==='poules2') return c.horaire2 || baseHoraire();
  if(p==='finales') return c.horaireF || baseHoraire();
  return baseHoraire();
}
function setHoraire(p, hor){
  if(p==='poules2') state.config.horaire2=hor;
  else if(p==='finales') state.config.horaireF=hor;
  else { state.config.startTime=hor.startTime; state.config.roundMinutes=hor.roundMinutes; state.config.setupMinutes=hor.setupMinutes; }
}
/* ---------- Règles de la phase en cours ---------- */
function liveRules(){ return rulesFor(state.livePhase); }
function fmtRules(r){ const n=r.sets||1; return `${n===1?'1 set':n+' sets'} · ${r.timed?`au temps (${r.setMinutes||15} min)`:`${r.pointsPerSet||25} pts${r.twoPointGap?", 2 d'écart":''}`}`; }

/* ---------- Chrono (set au temps) ---------- */
const timer={ remaining:(liveRules().setMinutes||15)*60, running:false, round:1, id:null, ended:false, started:false, endAt:null, preAlertDone:false };
const PRE_ALERT=30; // secondes avant la fin pour la pré-alerte
function fmtClock(s){ s=Math.max(0,s); const m=Math.floor(s/60), ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
function timerCard(){
  return `<div class="card" id="tmCard" style="margin-bottom:12px;text-align:center;padding:18px 16px">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">
      <span>⏱️ Set au temps</span><span>·</span><span>Tour <span id="tmRound">${timer.round}</span></span>
    </div>
    <div id="tmDisplay" style="font-family:var(--font-display);font-weight:800;font-size:62px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums">${fmtClock(timer.remaining)}</div>
    <div id="tmHint" class="muted" style="font-size:12.5px;margin-bottom:12px">Durée du set : ${liveRules().setMinutes||15} min</div>
    <div class="btn-row">
      <button class="btn" id="tmToggle" onclick="timerToggle()">Lancer le tour</button>
      <button class="btn ghost" id="tmReset" onclick="timerReset()" style="flex:none;width:52px" aria-label="Réinitialiser">↺</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn ghost sm" id="tmEnd" onclick="timerEndSet()">⏹ Fin du set (25 pts)</button>
      <button class="btn ghost sm" onclick="timerNext()">Tour suivant →</button>
    </div>
    <p class="muted" id="tmWake" style="font-size:11px;margin:12px 2px 0;line-height:1.4">🔆 L'écran reste allumé tant que le chrono tourne. 🔕 Pré-alerte à 30 s, 🔔 sonnerie + vibration à la fin.</p>
  </div>`;
}
function paintTimer(){
  const d=document.getElementById('tmDisplay'); if(!d) return;
  const full=(liveRules().setMinutes||15)*60;
  if(!timer.started){ timer.remaining=full; } // au repos : suit la durée configurée
  const timeout=timer.remaining<=0;            // chrono arrivé à zéro
  const stopped=timer.ended && !timeout;        // arrêté à la main (25 pts)
  const nearEnd=timer.running && timer.remaining>0 && timer.remaining<=PRE_ALERT; // dernières 30 s
  d.textContent=fmtClock(timer.remaining);
  d.style.color = timeout?'var(--danger)' : stopped?'var(--ok)' : nearEnd?'var(--warn,#b8860b)' : timer.running?'var(--brand)' : 'var(--fg)';
  const r=document.getElementById('tmRound'); if(r) r.textContent=timer.round;
  const t=document.getElementById('tmToggle');
  if(t) t.textContent = timeout?'Temps écoulé' : stopped?'Reprendre' : timer.running?'Pause' : (timer.remaining<full?'Reprendre':'Lancer le tour');
  const h=document.getElementById('tmHint');
  if(h) h.textContent = timeout?'🔔 Temps écoulé — sifflez la fin !' : stopped?'✋ Set arrêté (25 pts atteints)' : nearEnd?'⚠️ Dernières 30 secondes !' : `Durée du set : ${liveRules().setMinutes||15} min`;
  const c=document.getElementById('tmCard'); if(c) c.style.background = timeout?'var(--danger-soft)' : stopped?'var(--ok-soft)' : nearEnd?'var(--warn-soft,#f6e6c3)' : 'var(--surface)';
  const e=document.getElementById('tmEnd'); if(e) e.disabled = timeout||stopped;
}
/* Audio débloqué au premier geste utilisateur (lancement du tour), réutilisé pour la sonnerie. */
let _ac=null;
function ensureAudio(){ try{ if(!_ac) _ac=new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==='suspended') _ac.resume(); }catch(e){ return null; } return _ac; }
function timerBuzz(){
  const a=ensureAudio();
  if(a){ try{
    const now=a.currentTime;
    [0,.35,.70].forEach((t,i)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.type='square';
      o.frequency.value = i===2?1100:880;
      g.gain.setValueAtTime(.0001, now+t);
      g.gain.exponentialRampToValueAtTime(.3, now+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, now+t+.28);
      o.start(now+t); o.stop(now+t+.3);
    });
  }catch(e){} }
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,400]); }catch(e){}
}
/* Pré-alerte (30 s avant la fin) : signal plus doux et distinct de la sonnerie finale. */
function timerPreBuzz(){
  const a=ensureAudio();
  if(a){ try{
    const now=a.currentTime;
    [0,.28].forEach((t)=>{
      const o=a.createOscillator(), g=a.createGain();
      o.connect(g); g.connect(a.destination); o.type='sine';
      o.frequency.value=560;
      g.gain.setValueAtTime(.0001, now+t);
      g.gain.exponentialRampToValueAtTime(.18, now+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, now+t+.2);
      o.start(now+t); o.stop(now+t+.22);
    });
  }catch(e){} }
  try{ if(navigator.vibrate) navigator.vibrate(180); }catch(e){}
}
/* Empêche le verrouillage auto de l'écran pendant un tour. */
let _wake=null;
async function requestWake(){ try{ if('wakeLock' in navigator){ _wake=await navigator.wakeLock.request('screen'); } }catch(e){} }
function releaseWake(){ try{ if(_wake){ _wake.release(); _wake=null; } }catch(e){} }
function timerTick(){
  // Temps restant calculé sur l'horloge réelle : fiable même après un gel (écran verrouillé / app en arrière-plan).
  if(timer.endAt){ timer.remaining = Math.max(0, Math.round((timer.endAt - Date.now())/1000)); }
  else { timer.remaining--; }
  if(timer.remaining<=0){ timer.remaining=0; timerStop(); timerBuzz(); }
  else if(timer.remaining<=PRE_ALERT && !timer.preAlertDone){ timer.preAlertDone=true; timerPreBuzz(); }
  paintTimer();
}
function timerStop(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } timer.running=false; timer.endAt=null; releaseWake(); }
window.timerToggle=()=>{
  if(timer.remaining<=0 || timer.ended){ timer.remaining=(liveRules().setMinutes||15)*60; timer.ended=false; timer.preAlertDone=false; }
  if(timer.running){ timerStop(); }
  else {
    ensureAudio();                                    // débloque l'audio (geste utilisateur)
    timer.running=true; timer.started=true;
    timer.endAt = Date.now() + timer.remaining*1000;  // ancre horloge réelle
    timer.id=setInterval(timerTick,250);              // tick fin → resync rapide au réveil
    requestWake();                                    // garde l'écran allumé
    toast('Tour '+timer.round+' lancé');
  }
  paintTimer();
};
window.timerEndSet=()=>{ timerStop(); timer.ended=true; paintTimer(); toast('Set arrêté — 25 points atteints'); };
window.timerReset=()=>{ timerStop(); timer.ended=false; timer.started=false; timer.preAlertDone=false; timer.remaining=(liveRules().setMinutes||15)*60; paintTimer(); };
window.timerNext=()=>{ timerStop(); timer.ended=false; timer.preAlertDone=false; timer.round++; timer.remaining=(liveRules().setMinutes||15)*60; paintTimer(); toast('Tour '+timer.round+' prêt'); };
/* Au retour de l'app au premier plan : resync immédiat + reprise du wake lock (relâché pendant la mise en arrière-plan). */
document.addEventListener&&document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && timer.running){ requestWake(); timerTick(); }
});

/* ---------- Planning / matchs à venir (organisateur) ---------- */

let schedPhase='brassage';

let standPool=null;
function poolStandingRows(p){
  const n=p.teams.length, j=Math.max(0,n-1);
  const rows=p.teams.map((t,i)=>{
    const h=[...t.t].reduce((a,c)=>a+c.charCodeAt(0),0);
    const g=Math.min(j,(h+i)%(n||1));
    const pf=58+((h+i*5)%26), pc=52+((h*2+i*3)%24);
    const win=state.config.winPts??3, loss=state.config.lossPts??0;
    return {t:t.t, j, g, p:j-g, pts:g*win+(j-g)*loss, pf, pc};
  });
  rows.sort((a,b)=> b.pts-a.pts || (b.pf-b.pc)-(a.pf-a.pc) || a.t.localeCompare(b.t));
  return rows;
}
let standPhase='brassage';
const PHASE_LABEL={brassage:'Brassage',principal:'Principale',consolante:'Consolante'};
function phaseSeg(current,fn){

}
window.setStandPhase=k=>{ standPhase=k; standPool=null; render('standings'); };
screens.standings = ()=>{

  const rows=poolStandingRows(p);

  host.innerHTML=`<div style="padding:0">
    <h3 style="font-size:19px;margin-bottom:4px">Classements · ${PHASE_LABEL[standPhase]}</h3>
    ${phaseSeg(standPhase,'setStandPhase')}
    <div class="seg" style="flex-wrap:wrap">${pools.map(x=>`<button class="${x.letter===standPool?'on':''}" style="flex:1 0 auto;min-width:40px" onclick="standPool='${x.letter}';render('standings')">${x.letter}</button>`).join('')}</div>

    ${rows.map((r,i)=>{const d=r.pf-r.pc;const dc=d>0?'var(--ok)':d<0?'var(--danger)':'var(--muted)';return `<tr class="${i<2?'qual':''}"><td><span class="rk ${i<2?'top':''}">${i+1}</span>${r.t}</td><td>${r.j}</td><td style="color:var(--ok);font-weight:800">${r.g}</td><td>${r.pf}</td><td>${r.pc}</td><td style="color:${dc};font-weight:800">${d>0?'+':''}${d}</td><td><b>${r.pts}</b></td></tr>`;}).join('')}
    </tbody></table></div></div>
    <p class="muted" style="font-size:12px;margin-top:10px;line-height:1.6"><b>V</b> victoires · <b>PP</b> points pour · <b>PC</b> points contre · <b>Diff</b> différence · <b>Pts</b> points de classement (${state.config.winPts??3} par victoire, ${state.config.lossPts??0} par défaite).</p>
    <p class="muted" style="font-size:12.5px;margin-top:6px">${qualNote}</p>
  </div>`;
};

screens.validate = ()=>{

      ${step('🥉',sim.hasSemis?sim.third:'—','3ᵉ',46,'var(--surface-2)','var(--fg)')}
    </div>
    <p class="muted" style="text-align:center;font-size:11px;margin:14px 4px 0;line-height:1.45">Classement de démonstration (les têtes de série l'emportent). Les vrais résultats s'afficheront au fil des matchs.</p>

    <p class="muted" style="margin:-4px 0 10px;font-size:12px">🏆 Règles des finales : <b>${fmtNote}</b></p>
    <div class="seg">
      <button class="${bracketCat==='principal'?'on':''}" onclick="setBracketCat('principal')">Principale</button>
      ${state.config.phaseConsolante?`<button class="${bracketCat==='consolante'?'on':''}" onclick="setBracketCat('consolante')">Consolante</button>`:''}

function demoSets(n, salt, hi){
  // démo : l'équipe de gauche (favori) gagne ; scores par set, longueur = n sets
  hi=hi||25;
  const aw=Math.ceil((n+1)/2);          // sets gagnés par le vainqueur
  const lose=new Set();                  // sets perdus par le vainqueur (placés au milieu)
  for(let k=0;k<n-aw;k++) lose.add(2*k+1);
  const out=[];
  for(let i=0;i<n;i++){
    const winnerTakes=!lose.has(i), lo=Math.max(0, hi-2-((i+salt)*3)%7);
    out.push(winnerTakes?[hi,lo]:[lo,hi]); // [points A, points B], A = favori/vainqueur
  }
  return out;
}
function bm(a, b, aWin, sets){
  const played=!!(sets&&sets.length);
  const row=(t,isA,win)=>`<div class="r ${played&&win?'win':''}"><span class="nm">${t}</span><span class="sc">${
    played ? sets.map(s=>`<b>${isA?s[0]:s[1]}</b>`).join('') : '<b>–</b>'
  }</span></div>`;
  return `<div class="bm">${row(a,true,aWin)}${row(b,false,!aWin)}</div>`;
}

window.refSignIn=async ()=>{
  const mail=(document.getElementById('rl_mail').value||'').trim().toLowerCase();
  const pass=(document.getElementById('rl_pass').value||'').trim();
  if(!mail || !pass){ toast('E-mail et mot de passe requis'); return; }
  // API OVH → vérifie le rôle référent.
  try {
    const res = await api.login(mail, pass);
    const u = res && res.user;
    if(!u || u.role!=='referent'){ try{ await api.logout(); }catch(_){}; toast('Ce compte n\'est pas un référent'); return; }
    state.refProfile={ id:u.id, name:u.name, email:u.email };
    state.refSession='ovh'; go('refSpace');
  } catch(e){
    toast(e.status===401 ? 'Identifiants incorrects'
      : (e.status===403 ? (e.message||'⏸️ Ce compte est suspendu — contactez l\'organisation')
      : (e.message||'Connexion impossible — réessayez')));
    console.error(e);
  }
};

screens.myMatches = ()=>{
  setTop('Mes matchs'); tabbar.hidden=true;
  const team=state.captainTeam||(state.pools[0]&&state.pools[0].teams[0]&&state.pools[0].teams[0].t)||'—';
  const list=captainMatches(team); state.captainList=list;
  const myPool=state.pools.find(p=>p.teams.some(x=>x.t===team));
  const loc=myPool?`Poule ${myPool.letter} · ${gymName(myPool.gym)} · Terrain ${myPool.court}`:'—';
  const live=list.filter(m=>m.status==='live');
  const upcoming=list.filter(m=>m.status==='todo'||m.status==='pending');
  const played=list.filter(m=>m.status==='valid');
  const wins=played.filter(m=>wonBy(m,team)).length;
  host.innerHTML=`<div style="padding:0">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <span class="ic" style="width:46px;height:46px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:22px">🏐</span>
      <div><div style="font-family:var(--font-display);font-weight:800;font-size:17px">${team}</div><small class="muted">${loc}</small></div>
    </div>
    <div class="grid2" style="margin:10px 0 2px">
      <div class="card" style="text-align:center;padding:12px"><div style="font-family:var(--font-display);font-size:22px;font-weight:800">${list.length}</div><small class="muted">matchs au total</small></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-family:var(--font-display);font-size:22px;font-weight:800">${wins}/${played.length}</div><small class="muted">victoires</small></div>
    </div>
    ${(()=>{
      let h='';
      const refs=captainRefMatches(team).filter(m=>m.status!=='valid');
      if(live.length) h+=`<div class="mm-sep first"><span class="ic">🔴</span>En cours</div>${live.map(m=>matchCard(m,team,true)).join('')}`;
      if(refs.length) h+=`<div class="ref-panel">
          <div class="rp-head"><span class="ic" style="display:inline-flex;color:var(--brand)">${ICON.whistle}</span>À arbitrer · ${refs.length} match${refs.length>1?'s':''}</div>
          <div class="rp-sub">Votre équipe est de corvée d'arbitrage pendant qu'elle ne joue pas. Rendez-vous sur le terrain dès qu'il se libère.</div>
          ${refs.map(m=>refMatchCard(m)).join('')}</div>`;
      if(upcoming.length) h+=`<div class="mm-sep${live.length||refs.length?'':' first'}"><span class="ic">⏭️</span>À venir</div>
        <div class="card" style="margin:0 0 10px;background:var(--surface-2);border:none">
          <small class="muted">💡 Quand les deux capitaines saisissent le même score, le match est validé automatiquement. En cas d'écart, l'organisation tranche.</small>
        </div>
        ${upcoming.map((m,i)=>matchCard(m,team,!live.length&&i===0)).join('')}`;
      else if(!live.length) h+=`<div class="card" style="text-align:center;margin-top:16px;background:var(--ok-soft);border:none"><b>🎉 Tous vos matchs sont joués !</b></div>`;
      if(played.length) h+=`<div class="mm-sep"><span class="ic">✅</span>Déjà joués</div>${played.map(m=>matchCard(m,team)).join('')}`;
      if(!list.length && !refs.length) h=`<div class="card" style="text-align:center;margin-top:16px"><b>Aucun match programmé pour cette équipe.</b></div>`;
      return h;
    })()}
    ${installBlock('full')}
  </div>`;
};
function matchCard(m,team,hi){
  let badge='', action='';
  if(m.status==='valid'){ badge=`<span class="badge ok" style="margin-left:auto">✓ Validé</span>`; }
  else if(m.status==='live'){ badge=`<span class="badge warn" style="margin-left:auto">● En cours</span>`; }
  else if(m.status==='pending'){ badge=`<span class="badge wait" style="margin-left:auto">⏳ En attente de l'adversaire</span>`; }
  else { badge=`<span class="badge brand" style="margin-left:auto">À saisir</span>`; }
  const scObj = (m.status==='valid'||m.status==='live') ? {sa:m.sa, sb:m.sb, sets:m.sets}
    : (m.mine ? {sa:m.mine.sa, sb:m.mine.sb, sets:m.mine.sets} : {sa:null, sb:null});
  action = m.status==='todo'
    ? `<button class="btn sm" style="width:100%" onclick="go('enterScore',{id:'${m.id}'})">Saisir le score</button>`
    : m.status==='pending'
    ? `<button class="btn ghost sm" style="width:100%" onclick="go('enterScore',{id:'${m.id}'})">Modifier ma saisie</button>`
    : m.status==='live'
    ? `<button class="btn ghost sm" style="width:100%" onclick="go('enterScore',{id:'${m.id}'})">Saisir le score en direct</button>`
    : '';
  return `<div class="match"${hi?' style="border:2px solid var(--brand)"':''}>
    <div class="meta"><span class="chip"${hi?' style="background:var(--brand-soft);color:var(--brand)"':''}>Tour ${m.round} · ${m.time}</span><span>T${m.court} · ${m.gym}</span>${badge}</div>
    <div class="teams"><span class="t">${m.a}</span>
      <span class="sc">${scoreSC(scObj)}</span>
      <span class="t right">${m.b}</span></div>
    ${refLine(m)}
    ${action}</div>`;
}
function refMatchCard(m){
  const st = m.status==='live'
    ? `<span class="badge warn" style="margin-left:auto">● En cours</span>`
    : `<span class="badge brand" style="margin-left:auto">À arbitrer</span>`;
  return `<div class="match">
    <div class="meta"><span class="chip">Tour ${m.round} · ${m.time}</span><span>T${m.court} · ${m.gym}</span>${st}</div>
    <div class="teams"><span class="t">${m.a}</span>
      <span class="sc" style="color:var(--muted);font-weight:700">vs</span>
      <span class="t right">${m.b}</span></div>
    <div class="muted" style="font-size:11px;margin-top:7px">🏐 Poule ${m.pool}</div>
  </div>`;
}

screens.enterScore = (o)=>{
  setTop('Saisir le score'); tabbar.hidden=true;
  const list=state.captainList||[];
  const m=list.find(x=>x.id===o.id)||list[0]||{id:'',a:'Équipe A',b:'Équipe B',pool:'–',court:'–',mine:null};
  const nSets=Math.max(1, state.config.sets||1);
  const preSets=(m.mine&&m.mine.sets&&m.mine.sets.length)?m.mine.sets
    : (m.mine&&m.mine.sa!=null)?[[m.mine.sa,m.mine.sb]] : [];
  const rules = nSets===1
    ? `1 set à ${state.config.pointsPerSet} points${state.config.twoPointGap?' · 2 points d\'écart':''}`
    : `${nSets} sets à ${state.config.pointsPerSet} points${state.config.twoPointGap?' · 2 points d\'écart':''}`;
  const rows = Array.from({length:nSets}, (_,s)=>{
    const sa=preSets[s]?preSets[s][0]:''; const sb=preSets[s]?preSets[s][1]:'';
    return `<div class="scorebox"${s>0?' style="margin-top:12px"':''}>
      ${nSets>1?`<div class="setlab">Set ${s+1}</div>`:''}
      <div><div class="tlab">${m.a}</div><input class="num" id="sa${s}" inputmode="numeric" value="${sa}" placeholder="0"></div>
      <div class="dash">–</div>
      <div><div class="tlab">${m.b}</div><input class="num" id="sb${s}" inputmode="numeric" value="${sb}" placeholder="0"></div>
    </div>`;
  }).join('');
  host.innerHTML=`<div style="padding:0">
    <div class="card" style="text-align:center;background:var(--surface-2);border:none">
      <span class="chip">Poule ${m.pool} · Terrain ${m.court}</span>
      <div style="margin-top:8px;font-size:13px" class="muted">${rules}</div>
    </div>
    <div style="margin-top:20px">${rows}</div>
    <button class="btn" style="margin-top:16px" onclick="submitScore('${m.id}')">Valider mon score</button>
    <p class="demo-note" style="margin-top:16px">Pour la démo : saisissez <b>25–22</b> ${nSets>1?'à chaque set ':''}pour valider automatiquement (l'autre capitaine a mis pareil), ou un autre score pour créer un conflit.</p>
  </div>`;
};
window.submitScore=(id)=>{
  const nSets=Math.max(1, state.config.sets||1);
  const sets=[];
  for(let s=0;s<nSets;s++){
    const a=parseInt((document.getElementById('sa'+s)||{}).value);
    const b=parseInt((document.getElementById('sb'+s)||{}).value);
    if(isNaN(a)||isNaN(b)){ toast(nSets>1?'Entrez les scores de chaque set':'Entrez les deux scores'); return; }
    if(a===b){ toast(nSets>1?`Set ${s+1} : un set ne peut pas être à égalité`:'Un set ne peut pas finir à égalité'); return; }
    sets.push([a,b]);
  }
  const m=(state.captainList||[]).find(x=>x.id===id); if(!m){ go('myMatches',{replace:true}); return; }
  const se=state.schedule[+id.replace('cm','')]; // entrée de planning sous-jacente
  const sa=sets[0][0], sb=sets[0][1];
  // Demo logic: other captain already entered 25-22 on every set
  const allMatch=sets.every(([a,b])=>a===25&&b===22);
  if(allMatch){
    if(se) se.capState={status:'valid', sa, sb, sets, mine:null};
    toast('✓ Scores identiques — match validé automatiquement !');
  }else{
    if(se) se.capState={status:'pending', mine:{sa,sb,sets}};
    toast('Score enregistré — en attente de l\'autre capitaine');
  }
  go('myMatches',{replace:true});
};

window.submitNewPassword=async ()=>{
  const p1=(document.getElementById('sp_pass').value||'').trim();
  const p2=(document.getElementById('sp_pass2').value||'').trim();
  if(p1.length<6){ toast('Mot de passe trop court (6 caractères min.)'); return; }
  if(p1!==p2){ toast('Les mots de passe ne correspondent pas'); return; }
  const btn=document.getElementById('sp_submit');
  if(btn){ btn.disabled=true; btn.textContent='Enregistrement…'; }
  try{
    await api.changePassword(p1);
    try{ history.replaceState(null,'',location.pathname); }catch(_){}
    state.inviteFlow=null;
    toast('Mot de passe enregistré ✓');
    go(state.refSession ? 'refSpace' : 'home');
  }catch(e){
    console.error(e);
    toast(e.status===401 ? 'Connexion requise — reconnectez-vous' : (e.message||'Échec — réessayez'));
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer et continuer'; }
  }
};

/* ---------- Render dispatch ---------- */
function render(screen,opts){
  (screens[screen]||screens.home)(opts||{});
  // Retour tout en haut à chaque changement d'écran (y compris les .screen imbriqués).
  host.scrollTop=0;
  host.querySelectorAll('.screen').forEach(el=>{ el.scrollTop=0; });
  try{ window.scrollTo(0,0); }catch(_){}
}
(function boot(){
  const code=readJoinCodeFromUrl();
  if(code){ state.joinCode=code; go('scan'); toast('Code détecté : '+code); return; }
  go('home');
})();
